stages:
  - deploy

deploy-development:
  stage: deploy
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
  before_script:
    - apt -y update
    - apt -y install git git-ftp openssh-client
    - eval $(ssh-agent -s)
    - mkdir ~/.ssh
    - touch ~/.ssh/known_hosts
    - echo -e $PLNEPI_SSH_KEY > ~/.ssh/developer-key
    - chmod 400 ~/.ssh/developer-key
    - ssh-keyscan -p $PLNEPI_SSH_PORT $PLNEPI_WEB_SERVER >> ~/.ssh/known_hosts
  script:
    - git ftp push --user $PLNEPI_SSH_USER --key ~/.ssh/developer-key sftp://$PLNEPI_WEB_SERVER:$PLNEPI_SSH_PORT/opt/development/p2ep-plnepi/devel
  environment: development

deploy-production:
  stage: deploy
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apt -y update
    - apt -y install git git-ftp openssh-client
    - eval $(ssh-agent -s)
    - mkdir ~/.ssh
    - touch ~/.ssh/known_hosts
    - echo -e $PLNEPI_SSH_KEY > ~/.ssh/developer-key
    - chmod 400 ~/.ssh/developer-key
    - ssh-keyscan -p $PLNEPI_SSH_PORT $PLNEPI_WEB_SERVER >> ~/.ssh/known_hosts
  script:
    - git ftp push --user $PLNEPI_SSH_USER --key ~/.ssh/developer-key sftp://$PLNEPI_WEB_SERVER:$PLNEPI_SSH_PORT/opt/development/p2ep-plnepi/production
  environment: production